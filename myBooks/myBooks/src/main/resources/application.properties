spring.application.name=myBooks
spring.datasource.url=jdbc:h2:file:./bookbuddy;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Local H2 and the existing localhost PostgreSQL helper keep their current setup.
# The public-hosting profile enables versioned migrations instead.
spring.flyway.enabled=false
server.address=127.0.0.1
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.jackson.deserialization.fail-on-unknown-properties=false
# Open Library is a free public catalog; online=false keeps all catalog use offline.
bookbuddy.catalog.online=${BOOKBUDDY_CATALOG_ONLINE:true}

# Hosted free-tier integrations. Keys belong in server environment variables only.
# Disabling either feature or leaving its key blank causes no requests to that provider.
bookbuddy.ai.enabled=${BOOKBUDDY_AI_ENABLED:true}
bookbuddy.ai.api-key=${GROQ_API_KEY:}
bookbuddy.ai.model=openai/gpt-oss-20b
bookbuddy.google-books.enabled=${BOOKBUDDY_GOOGLE_BOOKS_ENABLED:true}
bookbuddy.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
