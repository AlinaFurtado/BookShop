# Public Render service; activate only on the host, not for normal localhost use.
server.address=0.0.0.0
server.port=${PORT:10000}
# Render terminates HTTPS and forwards the request to this private container.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=50
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Required at runtime. No H2 fallback and no credentials embedded in the image.
spring.datasource.url=${BOOKBUDDY_DB_URL}
spring.datasource.username=${BOOKBUDDY_DB_USER}
spring.datasource.password=${BOOKBUDDY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# Adopt the current schema without deleting records, then track later SQL changes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
