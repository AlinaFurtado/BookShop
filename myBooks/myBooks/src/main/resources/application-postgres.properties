# Activate with --spring.profiles.active=postgres for the localhost Neon lesson.
# Values come from the launcher process, not source files or command history.
spring.datasource.url=${BOOKBUDDY_DB_URL}
spring.datasource.username=${BOOKBUDDY_DB_USER}
spring.datasource.password=${BOOKBUDDY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# A few shared connections serve many requests; users do not need one each.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# First connection to an empty learning database creates our entity tables.
# Add versioned schema migrations before the public deployment.
spring.jpa.hibernate.ddl-auto=update
